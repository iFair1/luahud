plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

version = "${project.mod_version}+${project.minecraft_version}"
group = project.maven_group

base {
	archivesName = 'luahud'
}

loom { accessWidenerPath = rootProject.file('src/main/resources/luahud.accesswidener') }

loom.runs.configureEach {
	// Loom does not generate IDE runs for Stonecutter subprojects by default.
	generateRunConfig = project.name == '1.21'
	if (project.name == '1.21') {
		appendProjectPathToDisplayName = false
		// IntelliJ normalizes version module names differently from Loom.
		preferGradleTask = true
		// Preserve the existing development world's location for the baseline.
		runDir = rootProject.file('run').absolutePath
	}
}

repositories {
	maven { url = 'https://jitpack.io' }
	maven {
		name = "SquidDev"
		url = "https://maven.squiddev.cc"
		content { includeGroup "cc.tweaked" }
	}

	maven {
		name = "Terraformers"
		url = "https://maven.terraformersmc.com/"
	}
}

fabricApi {
	configureDataGeneration {
		client = true
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	implementation "cc.tweaked:cobalt:${project.cobalt_version}"
	include "cc.tweaked:cobalt:${project.cobalt_version}"

	testImplementation platform("org.junit:junit-bom:5.11.4")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"

	modCompileOnly "com.terraformersmc:modmenu:${modmenu_version}"
}

test {
	useJUnitPlatform()
	testLogging {
		events "failed"
		exceptionFormat "full"
	}
}

sourceSets {
	documentation {
		compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
		runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
	}
}

tasks.register('generateApiDocs', JavaExec) {
	group = 'documentation'
	description = 'Export the built-in Lua API as JSON for the documentation site.'
	dependsOn tasks.named('documentationClasses')
	classpath = sourceSets.documentation.runtimeClasspath
	mainClass = 'dev.ifair.luahud.api.core.DocumentationExportLauncher'
	def outputFile = project.name == '1.21'
			? rootProject.layout.buildDirectory.file("generated/api/v${project.mod_version}.json")
			: layout.buildDirectory.file("generated/api/v${project.mod_version}.json")
	inputs.files(sourceSets.main.output, sourceSets.documentation.output)
	outputs.file(outputFile)
	args outputFile.get().asFile.absolutePath
	systemProperty 'java.awt.headless', 'true'
}

processResources {
    def entityLightingMixins = (stonecutter.eval(stonecutter.current.version, '>=1.21.6') && stonecutter.eval(stonecutter.current.version, '<1.21.9'))
            ? '"EntityRenderStateMixin", "EntityGuiLightingMixin",' : ''
    def canvasMixins = stonecutter.eval(stonecutter.current.version, '>=1.21.6')
            ? '"CanvasDrawContextAccessor", "OpacityGuiStateMixin", "OpacityGuiRendererMixin", "OpacityVertexMixin",' : ''
    if (stonecutter.eval(stonecutter.current.version, '<1.21.5')) canvasMixins += '"OpacityRenderPhaseMixin",'
    if (stonecutter.eval(stonecutter.current.version, '=1.21.5')) canvasMixins += '"OpacityPipelineMixin",'
    inputs.property 'canvas_mixins', canvasMixins
    inputs.property 'entity_lighting_mixins', entityLightingMixins
    filesMatching('luahud.mixins.json') {
        expand 'entity_lighting_mixins': entityLightingMixins, 'canvas_mixins': canvasMixins
    }

	def version = project.version
	inputs.property "version", version
	inputs.property "minecraft_range", project.minecraft_range
	inputs.property "java_version", project.java_version
	inputs.property "loader_version", project.loader_version

	filesMatching("fabric.mod.json") {
		expand "version": version, "minecraft_range": project.minecraft_range,
				"java_version": project.java_version, "loader_version": project.loader_version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = project.java_version.toInteger()
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.toVersion(project.java_version)
	targetCompatibility = JavaVersion.toVersion(project.java_version)
}

jar {
	def projectName = rootProject.name
	inputs.property "projectName", projectName

	from(rootProject.file("LICENSE")) {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = 'luahud'
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
