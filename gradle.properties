# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Keep the existing Groovy build scripts; acknowledge Stonecutter's Kotlin DSL recommendation.
dev.kikugie.stonecutter.hard_mode=true

# Fabric Properties
# check these on https://fabricmc.net/develop
# Minecraft-specific dependencies live in versions/<minecraft>/gradle.properties.
loader_version=0.19.3
loom_version=1.17-SNAPSHOT

# Mod Properties
mod_version=1.0.0
maven_group=me.ifair.luahud

# Dependencies
cobalt_version=0.9.9
