pluginManagement {
	repositories {
		maven { url = 'https://maven.kikugie.dev/releases' }
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

plugins {
	id 'dev.kikugie.stonecutter' version '0.9.8'
}

stonecutter {
	centralScript = 'build.gradle'
	kotlinController = false
	create(rootProject) {
		// Compile against the oldest Minecraft version in each compatibility group.
		// Each target declares the full supported group in minecraft_range.
		versions('1.21', '1.21.2', '1.21.4', '1.21.5', '1.21.6', '1.21.9', '1.21.11')
		vcsVersion = '1.21'
	}
}

// Should match your modid
rootProject.name = 'luahud'

// Unqualified Gradle task selectors also select matching subproject tasks.
// Qualify our baseline shortcuts so `runClient` cannot launch every target.
def baselineShortcuts = ['build', 'test', 'clean', 'runClient', 'generateApiDocs']
gradle.startParameter.setTaskNames(gradle.startParameter.taskNames.collect { taskName ->
	baselineShortcuts.contains(taskName) ? ':' + taskName : taskName
})
